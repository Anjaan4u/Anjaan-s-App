name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o anjaan-code.zip
          unzip -o anjaan-assets.zip

      - name: Fix compileSdk
        run: |
          sed -i 's/compileSdk = 36/compileSdk = 37/' app/build.gradle.kts
          sed -i 's/compileSdkVersion 36/compileSdkVersion 37/' app/build.gradle.kts
          grep -n "compileSdk" app/build.gradle.kts || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore /tmp/anjaan.keystore -alias anjaan -keyalg RSA -keysize 2048 -validity 10000 -storepass anjaan123 -keypass anjaan123 -dname "CN=Anjaan, OU=App, O=Anjaan, L=City, S=State, C=IN"

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleProdRelease --stacktrace -Pandroid.injected.signing.store.file=/tmp/anjaan.keystore -Pandroid.injected.signing.store.password=anjaan123 -Pandroid.injected.signing.key.alias=anjaan -Pandroid.injected.signing.key.password=anjaan123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anjaan-release
          path: app/build/outputs/apk/prod/release/*arm64*.apk
